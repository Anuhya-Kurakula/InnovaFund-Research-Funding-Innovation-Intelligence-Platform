services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rfip
      POSTGRES_USER: rfip
      POSTGRES_PASSWORD: rfip
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfip -d rfip"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongodb:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://rfip:rfip@postgres:5432/rfip
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: rfip
      JWT_SECRET: dev-secret-key-innovafund-2026
      CORS_ORIGINS: http://localhost:5173
      PATENTS_PROVIDER: local
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mongodb: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
  mongo_data:
